name: wlb-app
region: was  # Washington DC (US) or fra (Frankfurt)
services:
  - type: http
    name: wlb
    dockerfile: Dockerfile
    dockercontext: .
    ports:
      - 8000:8000
    env:
      - PORT: 8000
      - LLM_API_KEY: ${LLM_API_KEY}
      - LLM_PROVIDER: deepseek
      - DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}
    instance_type: nano
    deploy_timeout: 600
    links:
      - wlb-db
  - type: postgresql
    name: wlb-db
    instance_type: nano
    env:
      - POSTGRES_USER: wlb
      - POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      - POSTGRES_DB: wlb

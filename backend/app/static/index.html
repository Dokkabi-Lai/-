<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>秋招投递助手</title>
  <link rel="stylesheet" href="/static/style.css?v=22">
</head>
<body>
  <div id="auth-page" class="auth-page">
    <div class="auth-card">
      <div class="auth-logo"><span class="logo-icon">秋</span></div>
      <h2 class="auth-title">秋招投递助手</h2>
      <p class="auth-sub">注册后，你的投递进度只属于你自己</p>
      <div id="auth-form">
        <div class="form-row"><input class="input" id="auth-email" type="email" placeholder="邮箱" autocomplete="email"></div>
        <div id="auth-register-fields" style="display:none">
          <div class="form-row"><input class="input" id="auth-nick" placeholder="昵称（可选）"></div>
          <div class="auth-avatar-picker" id="auth-avatar-picker"></div>
        </div>
        <div class="form-row"><input class="input" id="auth-pass" type="password" placeholder="密码（至少 8 位）" autocomplete="current-password"></div>
        <button class="btn primary full" id="auth-submit">登录</button>
        <div class="auth-switch"><span id="auth-switch-hint">还没有账号？</span> <a href="#" id="auth-toggle">去注册</a></div>
      </div>
    </div>
  </div>

  <div class="app" id="app-main" style="display:none">
    <aside class="sidebar">
      <div class="logo">
        <span class="logo-icon">秋</span>
        <span class="logo-text">秋招投递助手</span>
      </div>
      <div id="group-switcher" class="group-switcher"></div>
      <nav class="nav">
        <div class="nav-item active" data-page="home" onclick="showPage('home')"><span class="icon">⌂</span><span class="label">投递看板</span></div>
        <div class="nav-item" data-page="jobs" onclick="showPage('jobs')"><span class="icon">☰</span><span class="label">岗位库</span></div>
        <div class="nav-item" data-page="track" onclick="showPage('track')"><span class="icon">↻</span><span class="label">流程跟踪</span></div>
        <div class="nav-item" data-page="calendar" onclick="showPage('calendar')"><span class="icon">▦</span><span class="label">日历</span></div>
        <div class="nav-item" data-page="profile" onclick="showPage('profile')"><span class="icon">◉</span><span class="label">我的</span></div>
      </nav>
      <div class="nav-bottom">
        <div class="user-info user-card" id="user-info" onclick="showPage('profile')"></div>
        <div class="nav-item" onclick="logout()"><span class="icon">→</span><span class="label">退出登录</span></div>
      </div>
    </aside>
    <main class="main">
      <div id="mobile-group-bar" class="mobile-group-bar"></div>
      <div id="page-home" class="page active"></div>
      <div id="page-jobs" class="page"></div>
      <div id="page-track" class="page"></div>
      <div id="page-offers" class="page"></div>
      <div id="page-calendar" class="page"></div>
      <div id="page-profile" class="page"></div>
    </main>
  </div>
  <div class="modal-mask" id="modal-mask"></div>
  <div class="drop-overlay" id="drop-overlay"><span>松开即可导入岗位表格</span></div>
  <input type="file" id="excel-file-input" accept=".xlsx,.xls" hidden>
  <script src="/static/js/common.js?v=14"></script>
  <script src="/static/js/auth.js?v=15"></script>
  <script src="/static/js/groups.js?v=5"></script>
  <script src="/static/js/home.js?v=19"></script>
  <script src="/static/js/job-grid.js?v=2"></script>
  <script src="/static/js/jobs.js?v=16"></script>
  <script src="/static/js/track.js?v=15"></script>
  <script src="/static/js/offers.js?v=6"></script>
  <script src="/static/js/dashboard.js?v=3"></script>
  <script src="/static/js/calendar.js?v=11"></script>
  <script src="/static/js/profile.js?v=4"></script>
  <script>initAuth();</script>
</body>
</html>
